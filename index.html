<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-4 flex flex-col items-center">
<h1 class="text-2xl font-black">RENUKA EDITOR - REAL DOWNLOAD 🔥</h1>
<input type="file" id="up" accept="video/*" class="mt-4 bg-zinc-800 p-3 rounded-xl w-full max-w-lg">
<canvas id="c" class="mt-4 w-full max-w-2xl rounded-2xl bg-zinc-900"></canvas>
<video id="v" style="display:none" muted></video>

<div class="flex gap-3 mt-4">
<select id="filt" class="bg-zinc-800 p-3 rounded-xl"><option value="none">Original</option><option value="grayscale(100%)">B&W</option><option value="sepia(100%)">Vintage</option><option value="contrast(200%)">Contrast</option></select>
<select id="spd" class="bg-zinc-800 p-3 rounded-xl"><option value="1">1x</option><option value="0.5">0.5x Slow</option><option value="2">2x Fast</option></select>
</div>
<button id="dl" class="mt-4 bg-orange-500 text-black font-black px-8 py-4 rounded-full">⬇️ DOWNLOAD NOW</button>
<p id="status" class="mt-2 text-gray-400"></p>

<script>
let v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d'), rec, chunks=[];
document.getElementById('up').onchange=e=>{
 v.src=URL.createObjectURL(e.target.files[0]);
 v.onloadedmetadata=()=>{c.width=v.videoWidth; c.height=v.videoHeight; v.play(); draw();}
}
function draw(){
 if(v.paused||v.ended) return;
 ctx.filter=document.getElementById('filt').value;
 ctx.drawImage(v,0,0,c.width,c.height);
 requestAnimationFrame(draw);
}
document.getElementById('spd').onchange=e=>{v.playbackRate=parseFloat(e.target.value)}
document.getElementById('dl').onclick=async()=>{
 status.textContent="Recording... video play avutundi, aipoyaka download avuddi";
 chunks=[]; v.currentTime=0; v.play();
 let stream=c.captureStream(30);
 rec=new MediaRecorder(stream,{mimeType:'video/webm'});
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{
   let blob=new Blob(chunks,{type:'video/webm'});
   let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
   a.download='renuka-edited-video.webm'; a.click();
   status.textContent="Download ayyindi mowa! ✅";
 };
 rec.start();
 v.onended=()=>rec.stop();
}
</script>
</body></html>
